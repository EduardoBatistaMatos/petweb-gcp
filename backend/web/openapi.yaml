openapi: 3.0.3
info:
  title: Petshop API
  version: 1.1.0
  description: |
    API REST para cadastro e consulta de pets e gerenciamento do histórico fotográfico.
    Os metadados das fotos ficam em `pet.fotos` (JSONB) e a URL da capa em
    `pet.img_principal`; os arquivos binários ficam no Google Cloud Storage.
    Upload e exclusão de objetos são feitos pelo backend.
servers:
  - url: /
    description: Servidor da aplicação
tags:
  - name: Pets
  - name: Fotos
  - name: Sistema
paths:
  /pets:
    get:
      tags: [Pets]
      summary: Lista os pets
      operationId: listarPets
      responses:
        '200':
          description: Pets cadastrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Pets]
      summary: Cadastra um pet
      description: |
        Aceita JSON ou multipart/form-data. O formulário multipart pode incluir
        uma imagem legada no campo `imagem` (também aceita `image` ou `foto`).
        Para cadastrar várias fotos no histórico, use `POST /pets/{id}/fotos`.
      operationId: criarPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PetMultipart'
      responses:
        '201':
          description: Pet criado
          headers:
            Location:
              description: Caminho do pet criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '413':
          $ref: '#/components/responses/ConteudoMuitoGrande'
        '415':
          $ref: '#/components/responses/TipoNaoSuportado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /pets/{id}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Pets]
      summary: Busca um pet pelo identificador
      operationId: buscarPet
      responses:
        '200':
          description: Pet encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Pets]
      summary: Atualiza um pet
      description: Substitui os dados enviados do pet; aceita JSON ou multipart/form-data.
      operationId: atualizarPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PetMultipart'
      responses:
        '200':
          description: Pet atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '413':
          $ref: '#/components/responses/ConteudoMuitoGrande'
        '415':
          $ref: '#/components/responses/TipoNaoSuportado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Pets]
      summary: Exclui um pet
      description: O backend remove os arquivos associados do Google Cloud Storage antes de excluir o registro.
      operationId: excluirPet
      responses:
        '204':
          description: Pet e arquivos associados excluídos
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /pets/{id}/fotos:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Fotos]
      summary: Lista o histórico fotográfico do pet
      description: Retorna as fotos ordenadas por data decrescente e identificadas com a capa atual.
      operationId: listarFotosPet
      responses:
        '200':
          description: Fotos do pet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetFoto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Fotos]
      summary: Adiciona uma ou mais fotos ao histórico
      description: |
        Envie de 1 a 10 imagens no campo multipart repetido `fotos` (o alias
        `foto` também é aceito) e uma única `data_foto` no formato YYYY-MM-DD.
        Cada arquivo pode ter até 10 MiB; o corpo do lote pode ter até 100 MiB
        mais o overhead multipart. Os arquivos são enviados pelo backend ao GCS.
        A primeira foto do pet é definida automaticamente como principal.
      operationId: adicionarFotosPet
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data_foto, fotos]
              properties:
                data_foto:
                  type: string
                  format: date
                  description: Data associada a todas as fotos deste lote.
                fotos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                  description: Repita o campo fotos para enviar vários arquivos.
      responses:
        '201':
          description: Fotos armazenadas e metadados persistidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetFoto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '413':
          $ref: '#/components/responses/ConteudoMuitoGrande'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /pets/{id}/fotos/{fotoId}/principal:
    parameters:
      - $ref: '#/components/parameters/PetId'
      - $ref: '#/components/parameters/FotoId'
    put:
      tags: [Fotos]
      summary: Define uma foto como principal
      description: Atualiza a capa persistida do pet e retorna a coleção atualizada.
      operationId: definirFotoPrincipal
      responses:
        '200':
          description: Coleção atualizada com a nova foto principal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetFoto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /pets/{id}/fotos/{fotoId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
      - $ref: '#/components/parameters/FotoId'
    delete:
      tags: [Fotos]
      summary: Exclui uma foto do histórico
      description: O backend exclui o objeto do GCS antes de remover os metadados. Se a capa for excluída, a foto mais recente restante vira principal; sem fotos restantes, o pet fica sem capa.
      operationId: excluirFotoPet
      responses:
        '204':
          description: Foto e objeto removidos
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /health:
    get:
      tags: [Sistema]
      summary: Verifica a disponibilidade da API e do banco
      operationId: healthCheck
      responses:
        '200':
          description: API e banco disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Banco indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
components:
  parameters:
    PetId:
      name: id
      in: path
      required: true
      description: Identificador inteiro positivo do pet.
      schema:
        type: integer
        format: int32
        minimum: 1
    FotoId:
      name: fotoId
      in: path
      required: true
      description: Identificador da foto persistida na coleção do pet.
      schema:
        type: string
        maxLength: 64
  schemas:
    Pet:
      type: object
      required: [id, nome, especie, responsavel]
      properties:
        id: { type: integer, format: int32 }
        nome: { type: string }
        especie: { type: string }
        raca: { type: string, nullable: true }
        porte: { type: string, nullable: true }
        responsavel: { type: string }
        data_nascimento: { type: string, format: date, nullable: true }
        data_insercao_img: { type: string, format: date-time, nullable: true }
        detalhes: { type: string, nullable: true }
        imagem_url:
          type: string
          nullable: true
          description: URL da foto principal para exibição da capa.
    PetRequest:
      type: object
      required: [nome, especie, responsavel]
      properties:
        nome: { type: string }
        especie: { type: string }
        raca: { type: string, nullable: true }
        porte: { type: string, nullable: true }
        responsavel: { type: string }
        data_nascimento: { type: string, format: date, nullable: true }
        data_insercao_img: { type: string, format: date-time, nullable: true }
        detalhes: { type: string, nullable: true }
        imagem_url:
          type: string
          nullable: true
          description: URL preexistente para compatibilidade com clientes legados.
    PetMultipart:
      type: object
      required: [nome, especie, responsavel]
      properties:
        nome: { type: string }
        especie: { type: string }
        raca: { type: string }
        porte: { type: string }
        responsavel: { type: string }
        data_nascimento: { type: string, format: date }
        data_insercao_img: { type: string, format: date-time }
        detalhes: { type: string }
        imagem_url: { type: string }
        imagem:
          type: string
          format: binary
          description: Imagem legada opcional; aliases `image` e `foto` também são aceitos.
    PetFoto:
      type: object
      required: [id, pet_id, url, data_foto, img_principal]
      properties:
        id: { type: string, description: Identificador único da foto dentro do histórico. }
        pet_id: { type: integer, format: int32 }
        url: { type: string, format: uri, description: URL pública ou assinada do objeto no GCS. }
        data_foto: { type: string, format: date }
        img_principal: { type: boolean }
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [up, down] }
    Error:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        details:
          type: array
          items: {}
  responses:
    RequisicaoInvalida:
      description: Identificador, campos, data, arquivo ou configuração de storage inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NaoEncontrado:
      description: Pet ou foto não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConteudoMuitoGrande:
      description: Limite de tamanho excedido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TipoNaoSuportado:
      description: Content-Type não suportado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MetodoNaoPermitido:
      description: Método HTTP não permitido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ErroInterno:
      description: Erro interno ao acessar o banco ou processar a requisição
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
